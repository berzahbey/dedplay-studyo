# Yalniz Studyo (Kitap Okuma ve Osmanlica cevirici ayri kuruluysa). Hepsi bir arada kurulum: docker-compose.stack.yml
name: dedplay-studyo
services:
  app:
    build: .
    image: berzahbey/dedplay-studyo:latest
    container_name: dedplay-studyo
    restart: unless-stopped
    ports:
      - "8070:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /DATA/AppData/dedplay-studyo/kutuphane:/data
      - /DATA/AppData/dedplay-studyo/studyo:/studyo-data
      - /media/ZimaOS-HD/Kitap:/kaynak:ro
      - /DATA/AppData/dedplay-studyo/kitap-okuma/text:/okuma-text:ro
      - /media/ZimaOS-HD/Media/Music/audio:/cikti
      - /media/ZimaOS-HD/Media/Kitaplar:/cikti-kitaplar
    environment:
      - OKUMA_URL=http://host.docker.internal:8020
      - OSMANLICA_URL=http://host.docker.internal:8089
      - OSM_USE_OLLAMA=false
      - STUDYO_DATA_DIR=/studyo-data
      - CIKTI_DIR=/cikti-kitaplar
      - STUDYO_URL=http://host.docker.internal:8070
      - OTOMATIK_CEVIRI=0
