# =============================================================================
#  DEDPLAY STUDIO — HEPSİ BİR ARADA KURULUM
#  Tek seferde 3 uygulama kurulur:
#    Stüdyo (8070, Kütüphane dahil) · Kitap Okuma (8020) · Osmanlıca çevirici (8089)
#  + işlemci ayarı servisi: ZimaOS'un koyduğu 1 çekirdek sınırını otomatik kaldırır.
#  Yapay zekâ (Ollama) yok: Osmanlıca çevirici kural ve sözlükle çalışır (9 Ekim 2026'dan beri).
#  Uygulamalar birbirine sunucunun kendisi üzerinden (portlarla) ulaşır; ZimaOS'un ağ ayarından etkilenmez.
#  Uygulamaların kendi verileri otomatik olarak /DATA/AppData/dedplay-studyo/ altına gider.
#
#  ZimaOS: Uygulama Mağazası → Özel Kurulum (Custom Install) → İçe aktar → bu dosyanın
#  içeriğini yapıştır. Yapıştırmadan önce SADECE aşağıdaki iki klasörü kontrol et.
# =============================================================================

x-klasorler:
  # ▼▼▼ DEĞİŞTİRİLEBİLİR 1: KİTAP KLASÖRÜ ▼▼▼
  # Eklenecek kitapların durduğu klasör (Stüdyo'nun "Sunucudan seç" bölümü).
  # Uygulamalar bu klasöre hiçbir şey yazmaz, sadece okur.
  kitap: &kitap /media/ZimaOS-HD/Kitap

  # ▼▼▼ DEĞİŞTİRİLEBİLİR 2: ÇIKTI KLASÖRÜ ▼▼▼
  # Bütün çıktılar buraya düzenli yazılır:
  #   EPUB|PDF|DOCX|TXT|HTML/<Dil>/<Eser - Yazar>.<uzantı>, MP3/<Ad>/, M4B/<Ad>.m4b
  # İçindeki gizli ".seslendirme" klasörü seslendirmenin çalışma klasörüdür: SİLME
  # (düzeltmeden sonra yalnız değişen bölümün sesi buna dayanır; MP3/M4B dosyaları oradakilere sabit bağlantıdır).
  cikti: &cikti /media/ZimaOS-HD/dedplay
  seslendirme: &seslendirme /media/ZimaOS-HD/dedplay/.seslendirme

# ▼ Bundan sonrasına dokunmana gerek yok ▼

name: dedplay-studyo
services:

  # ---------------- Stüdyo: tek arayüz (Kütüphane dahil), diğerlerini yönetir ----------------
  studyo:
    image: berzahbey/dedplay-studyo:latest
    container_name: dedplay-studyo
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    depends_on: [kitap-okuma, osmanlica]
    ports:
      - "8070:8000"
    environment:
      OKUMA_URL: http://host.docker.internal:8020
      OSMANLICA_URL: http://host.docker.internal:8089
      DATA_DIR: /data              # Kütüphane verileri (kitaplar, OCR önbelleği, Surya modelleri)
      STUDYO_DATA_DIR: /studyo-data
      CIKTI_DIR: /cikti-kitaplar   # eski Kütüphane EPUB klasörü (geriye uyum)
      DEDPLAY_DIR: /dedplay        # ana çıktı klasörü (EPUB, PDF, DOCX, TXT, HTML, MP3, M4B)
      OUTPUT_DIR: /dedplay/.seslendirme   # Kitap Okuma'nın çalışma klasörü (aynı klasör, Stüdyo içinden)
      STUDYO_URL: http://host.docker.internal:8070
      OTOMATIK_CEVIRI: "0"
    volumes:
      - type: bind
        source: /DATA/AppData/dedplay-studyo/studyo
        target: /studyo-data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/dedplay-studyo/kutuphane
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /media/ZimaOS-HD/Media/Kitaplar
        target: /cikti-kitaplar
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/dedplay-studyo/kitap-okuma/text
        target: /okuma-text
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: *kitap
        target: /kaynak
        read_only: true
      - type: bind
        source: *cikti
        target: /dedplay
        bind:
          create_host_path: true
      - type: bind
        source: *seslendirme
        target: /cikti
        bind:
          create_host_path: true
    x-casaos:
      volumes:
        - container: /kaynak
          description:
            en_us: "Kitap klasörü: eklenecek kitapların bulunduğu klasör (sadece okunur)."
        - container: /dedplay
          description:
            en_us: "Çıktı klasörü: EPUB, PDF, Word, TXT, HTML, MP3 ve M4B dosyaları buraya düzenli kaydedilir."
        - container: /cikti
          description:
            en_us: "Seslendirmenin çalışma klasörü (çıktı klasöründeki gizli .seslendirme). Silme."
        - container: /data
          description:
            en_us: "Kütüphane verileri (kitaplar, düzeltmeler, OCR önbelleği). Değiştirme."
        - container: /studyo-data
          description:
            en_us: "Stüdyo verileri. Değiştirme."
        - container: /cikti-kitaplar
          description:
            en_us: "Eski Kütüphane EPUB klasörü."
        - container: /okuma-text
          description:
            en_us: "Kitap Okuma'nın metin parçaları. Değiştirme."

  # ---------------- Kitap Okuma: sesli kitap (Piper; Arapça için FastPitch) ----------------
  kitap-okuma:
    image: berzahbey/dedplay-kitap-okuma:latest
    container_name: dedplay-kitap-okuma
    restart: unless-stopped
    ports:
      - "8020:8000"
    volumes:
      - type: bind
        source: /DATA/AppData/dedplay-studyo/kitap-okuma/book
        target: /app/books
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/dedplay-studyo/kitap-okuma/text
        target: /app/text
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/dedplay-studyo/kitap-okuma/voices
        target: /root/.cache/piper
        bind:
          create_host_path: true
      - type: bind
        source: *kitap
        target: /app/kaynak-kitaplar
      - type: bind
        source: *seslendirme
        target: /app/audio
        bind:
          create_host_path: true

  # ---------------- Osmanlıca çevirici (kural + sözlük, Hayrat ölçüsü; yapay zekâ yok) ----------------
  osmanlica:
    image: berzahbey/osmanlica-cevirici:latest
    container_name: osmanlica-cevirici
    restart: unless-stopped
    ports:
      - "8089:8000"
    volumes:
      # Sözlük (/app/data) bilerek bağlanmadı: güncel sözlük imajın içinden gelir.
      - type: bind
        source: /DATA/AppData/dedplay-studyo/osmanlica
        target: /data
        bind:
          create_host_path: true

  # ---------------- İşlemci ayarı ----------------
  # ZimaOS "Özel Kurulum"da her uygulamaya kendiliğinden 1 çekirdek sınırı koyabiliyor.
  # Bu servis dakikada bir kontrol eder ve sınırı sunucunun bütün çekirdeklerine çıkarır
  # (çekirdek sayısını kendisi algılar). Elle bir şey yapmana gerek yok.
  islemci-ayari:
    image: docker:cli
    container_name: dedplay-islemci-ayari
    restart: unless-stopped
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    # Betik kodlanmış (base64) olarak duruyor: içinde dolar işareti geçmediği için ZimaOS ve
    # Docker Compose onu bozamaz. Çözülmüş hâli: dakikada bir dedplay-studyo, dedplay-kitap-okuma ve
    # osmanlica-cevirici'nin işlemci sınırına bakar, sunucunun çekirdek sayısından azsa (nproc) en yükseğe çıkarır.
    entrypoint: ["/bin/sh", "-c", "echo  | base64 -d | sh"]

x-casaos:
  architectures: [amd64]
  main: studyo
  author: berzahbey
  developer: berzahbey
  category: Utilities
  index: /
  port_map: "8070"
  scheme: http
  icon: https://raw.githubusercontent.com/berzahbey/dedplay-studyo/main/icon.png
  title:
    en_us: Dedplay Studio
  tagline:
    en_us: Kitabı ver; temizlensin, EPUB olsun, seslendirilsin, Osmanlıcaya aktarılsın
  description:
    en_us: >-
      Dedplay Studio (Kütüphane dahil), Kitap Okuma ve Osmanlıca çeviriciyi tek arayüzde birleştirir.
      Türkçe kitap temizlenir, EPUB olur; ardından seslendirilir (M4B) ve Osmanlıcaya aktarılır. Bütün çıktılar seçtiğin klasöre düzenli kaydedilir.
